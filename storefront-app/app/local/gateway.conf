# Local stand-in for the Gateway API HTTPRoutes on EKS — same paths, same rules.
# payment-service and notification-service are deliberately NOT routed:
# they are internal only, here and in the cluster.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s; # Docker DNS, so restarts get new IPs

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location /api/products  { set $u http://catalogue:8080; proxy_pass $u; }
  location /api/carts     { set $u http://cart:8080;      proxy_pass $u; }
  location /api/orders    { set $u http://order:8080;     proxy_pass $u; }
  location /api/inventory {
    limit_except GET { deny all; } # reservations are internal (order-service only)
    set $u http://inventory:8080; proxy_pass $u;
  }
  location /              { set $u http://frontend:8080;  proxy_pass $u; }
}
