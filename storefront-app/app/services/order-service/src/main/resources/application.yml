server:
  port: 8080
  shutdown: graceful

spring:
  mvc:
    problemdetails:
      enabled: true # errors as RFC 7807 JSON with a readable "detail"
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storefront?currentSchema=ordering}
    username: ${DB_USERNAME:storefront}
    password: ${DB_PASSWORD:storefront}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: ordering
  flyway:
    schemas: ordering
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  rabbitmq:
    # Amazon MQ gives an amqps:// endpoint on 5671 — the scheme turns TLS on.
    addresses: ${MQ_URL:amqp://localhost:5672}
    username: ${MQ_USERNAME:storefront}
    password: ${MQ_PASSWORD:storefront}

clients:
  cart:
    url: ${CART_URL:http://localhost:8082}
  catalogue:
    url: ${CATALOGUE_URL:http://localhost:8081}
  inventory:
    url: ${INVENTORY_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
