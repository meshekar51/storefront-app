server:
  port: 8080
  shutdown: graceful

spring:
  mvc:
    problemdetails:
      enabled: true # errors as RFC 7807 JSON with a readable "detail"
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storefront?currentSchema=payment}
    username: ${DB_USERNAME:storefront}
    password: ${DB_PASSWORD:storefront}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: payment
  flyway:
    schemas: payment

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
