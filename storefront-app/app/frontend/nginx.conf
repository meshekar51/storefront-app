# Static files only. /api/* never reaches this container: the Gateway API
# (or the local gateway in docker compose) sends it straight to the services.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # An /api/ path that reached the frontend matched no route (e.g. an internal
  # endpoint called from outside). Say so, instead of returning index.html.
  location /api/ {
    default_type application/json;
    return 404 '{"detail":"Not found"}';
  }

  # Hashed build assets can be cached for a year; index.html never.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
