# ─────────────────────────────────────────────────────────────────────
#  AWS Secrets Manager  ──(External Secrets Operator)──▶  Kubernetes Secrets
#
#  storefront/postgres  → Secret "postgres"  keys: host port dbname username password
#  storefront/redis     → Secret "redis"     keys: host port password
#  storefront/rabbitmq  → Secret "rabbitmq"  keys: url username password
#
#  Rotate a password in AWS → within refreshInterval the Kubernetes Secret
#  follows; restart the Deployment to pick it up.
# ─────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
      # No auth block: the operator uses its own EKS Pod Identity role,
      # which can read ONLY the three storefront/* secrets.
  conditions:
    - namespaces: [storefront] # no other namespace may use this store
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: storefront
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: postgres, creationPolicy: Owner }
  dataFrom:
    - extract: { key: storefront/postgres }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
  namespace: storefront
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: redis, creationPolicy: Owner }
  dataFrom:
    - extract: { key: storefront/redis }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq
  namespace: storefront
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: rabbitmq, creationPolicy: Owner }
  dataFrom:
    - extract: { key: storefront/rabbitmq }
