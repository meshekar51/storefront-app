# ─────────────────────────────────────────────────────────────────────
#  Gateway API routes: path → Service.  The most specific path wins, so
#  /api/... never falls through to the frontend.
#
#    GET  /api/products/**   → catalogue
#    *    /api/carts/**      → cart
#    *    /api/orders/**     → order
#    GET  /api/inventory/**  → inventory   (reservations stay internal)
#         /                  → frontend
#
#  NOT routed: payment, notification — unreachable from the internet.
# ─────────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalogue
spec:
  parentRefs: [{ name: storefront }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/products }
          method: GET
      backendRefs: [{ name: catalogue, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cart
spec:
  parentRefs: [{ name: storefront }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/carts }
      backendRefs: [{ name: cart, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order
spec:
  parentRefs: [{ name: storefront }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/orders }
      backendRefs: [{ name: order, port: 80 }]
      timeouts:
        request: 30s # checkout calls four services; give it room
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory
spec:
  parentRefs: [{ name: storefront }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/inventory }
          method: GET
      backendRefs: [{ name: inventory, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs: [{ name: storefront }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs: [{ name: frontend, port: 80 }]
