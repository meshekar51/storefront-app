apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The application. __ECR_REGISTRY__ and __IMAGE_TAG__ are filled in by
# scripts/04-deploy-apps.sh.
namespace: storefront

labels:
  - pairs:
      app.kubernetes.io/part-of: storefront
    includeSelectors: false

resources:
  - config.yaml
  - catalogue.yaml
  - cart.yaml
  - inventory.yaml
  - payment.yaml
  - order.yaml
  - notification.yaml
  - frontend.yaml
  - routes.yaml
  - network-policies.yaml
